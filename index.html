<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Grok Bot Galaxy Recap</title>
<style>
:root { --bg:#0b0f14; --panel:#121821; --text:#e7ecf3; --muted:#9aa7b8; --accent:#7dd3fc; --border:#243041; }
* { box-sizing:border-box; }
body { margin:0; font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif; background:var(--bg); color:var(--text); line-height:1.65; }
main { max-width:760px; margin:0 auto; padding:2.4rem 1.25rem 3rem; }
h1 { font-size:1.7rem; margin:0 0 .4rem; }
.lead { color:var(--muted); margin:0 0 1.6rem; }
.card { display:block; text-decoration:none; color:inherit; background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:1.15rem 1.2rem; margin:0 0 .8rem; }
.card:hover { border-color:#3a516c; }
.card h2 { margin:0 0 .35rem; font-size:1.15rem; }
.card p { margin:0; color:var(--muted); font-size:.95rem; }
.ready { color:#a7f3d0; font-size:.8rem; font-weight:700; letter-spacing:.04em; }
.wait { color:var(--muted); font-size:.8rem; letter-spacing:.04em; }
a.inline { color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Grok Bot Galaxy Recap</h1>
  <p class="lead">X Broadcast の厚めレポート。ブラウザでそのまま読めます。</p>

  <div class="card">
    <div class="wait">PENDING</div>
    <h2>Day 2</h2>
    <p>未登録</p>
  </div>
  <div class="card">
    <div class="wait">PENDING</div>

  </div>
  <p class="lead">ソース: <a class="inline" href="https://x.com/i/broadcasts/1AxRnZbVpjaxl">Day 1 broadcast</a></p>
</main>
</body>
</html>
